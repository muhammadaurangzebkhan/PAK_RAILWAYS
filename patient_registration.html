<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Cairns Pakistan Railway Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="patient_registration.html">Patient Registration</a></li>
                <li><a href="doctors_profile.html">Doctors Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="registration-form">
            <h1>Patient Registration</h1>
            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4"></textarea>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="emergency_contact">Emergency Contact:</label>
                <input type="text" id="emergency_contact" name="emergency_contact" required>

                <label for="blood_group">Blood Group:</label>
                <input type="text" id="blood_group" name="blood_group">

                <button type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Cairns Pakistan Railway Hospital. All rights reserved.</p>
    </footer>

    <style>
        .registration-form {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #f2f2f2;
            border-radius: 8px;
            color: #006400;
        }
        .registration-form input, .registration-form select, .registration-form textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .registration-form button {
            background-color: #006400;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
    <script src="patient_registration_script.js"></script>
</body>
</html>
