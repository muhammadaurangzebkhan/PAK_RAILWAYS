<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Schedule Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Train Schedule Management</h1>
    <div class="container">
        <!-- Departures Section -->
        <section id="departures-section">
            <h2>Departures</h2>
            <form id="add-departure-form">
                <h3>Add New Departure</h3>
                <div>
                    <label for="dep-train-no">Train No:</label>
                    <input type="text" id="dep-train-no" name="trainNo" required>
                </div>
                <div>
                    <label for="dep-train-name">Train Name:</label>
                    <input type="text" id="dep-train-name" name="trainName" required>
                </div>
                <div>
                    <label for="dep-scheduled-time">Scheduled Time:</label>
                    <input type="time" id="dep-scheduled-time" name="scheduledTime" required>
                </div>
                <div>
                    <label for="dep-expected-time">Expected Time:</label>
                    <input type="time" id="dep-expected-time" name="expectedTime"> <!-- Removed 'required' for auto-status logic -->
                </div>
                <div>
                    <label for="dep-status">Status:</label>
                    <select id="dep-status" name="status">
                        <option value="On Time">On Time</option>
                        <option value="Delayed">Delayed</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Departed">Departed</option>
                    </select>
                </div>
                <div>
                    <label for="dep-platform-no">Expected Platform No:</label>
                    <input type="text" id="dep-platform-no" name="platformNo">
                </div>
                <button type="submit">Add Departure</button>
            </form>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Train No</th>
                            <th>Train Name</th>
                            <th>Scheduled Time</th>
                            <th>Expected Time</th>
                            <th>Status</th>
                            <th>Expected Platform No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="departures-table-body">
                        <!-- Train data will be dynamically inserted here by script.js -->
                    </tbody>
                </table>
            </div>
        </section>

        <hr class="section-divider"> <!-- This will be hidden by CSS but kept for structure -->

        <!-- Arrivals Section -->
        <section id="arrivals-section">
            <h2>Arrivals</h2>
            <form id="add-arrival-form">
                <h3>Add New Arrival</h3>
                <div>
                    <label for="arr-train-no">Train No:</label>
                    <input type="text" id="arr-train-no" name="trainNo" required>
                </div>
                <div>
                    <label for="arr-train-name">Train Name:</label>
                    <input type="text" id="arr-train-name" name="trainName" required>
                </div>
                <div>
                    <label for="arr-scheduled-time">Scheduled Time:</label>
                    <input type="time" id="arr-scheduled-time" name="scheduledTime" required>
                </div>
                <div>
                    <label for="arr-expected-time">Expected Time:</label>
                    <input type="time" id="arr-expected-time" name="expectedTime"> <!-- Removed 'required' for auto-status logic -->
                </div>
                <div>
                    <label for="arr-status">Status:</label>
                    <select id="arr-status" name="status">
                        <option value="On Time">On Time</option>
                        <option value="Delayed">Delayed</option>
                        <option value="Cancelled">Cancelled</option>
                        <option value="Arrived">Arrived</option>
                    </select>
                </div>
                <div>
                    <label for="arr-platform-no">Expected Platform No:</label>
                    <input type="text" id="arr-platform-no" name="platformNo">
                </div>
                <button type="submit">Add Arrival</button>
            </form>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Train No</th>
                            <th>Train Name</th>
                            <th>Scheduled Time</th>
                            <th>Expected Time</th>
                            <th>Status</th>
                            <th>Expected Platform No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="arrivals-table-body">
                        <!-- Train data will be dynamically inserted here by script.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </div> <!-- Closing container div -->
    <script src="script.js"></script>
</body>
</html>
