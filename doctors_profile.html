<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Profile - Cairns Pakistan Railway Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="patient_registration.html">Patient Registration</a></li>
                <li><a href="doctors_profile.html">Doctors Profile</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="doctors-profile-container">
            <h1>Doctors Profile Management</h1>

            <div class="toolbar">
                <button id="add-doctor-btn">Add Doctor</button>
                <input type="file" id="import-excel" accept=".xlsx, .xls">
                <label for="import-excel" class="button-label">Import from Excel</label>
            </div>

            <div class="doctor-selection">
                <label for="doctor-list">Select a Doctor:</label>
                <select id="doctor-list">
                    <!-- Doctor options will be populated dynamically -->
                </select>
            </div>

            <div id="doctor-details" class="doctor-details-form">
                <!-- Doctor details will be displayed here -->
            </div>

            <!-- Add/Update Modal -->
            <div id="doctor-modal" class="modal">
                <div class="modal-content">
                    <span class="close-button">&times;</span>
                    <h2 id="modal-title">Add/Update Doctor</h2>
                    <form id="doctor-form">
                        <input type="hidden" id="doctor-id">
                        <label for="doctor-name">Name:</label>
                        <input type="text" id="doctor-name" required>

                        <label for="checkup-fee">Checkup Fee:</label>
                        <input type="number" id="checkup-fee" required>

                        <label for="department">Department:</label>
                        <input type="text" id="department" required>

                        <label for="experience">Experience (years):</label>
                        <input type="number" id="experience" required>

                        <label for="specialization">Specialization:</label>
                        <input type="text" id="specialization" required>

                        <label for="doctor-picture">Picture:</label>
                        <input type="file" id="doctor-picture" accept="image/*">

                        <button type="submit">Save</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Cairns Pakistan Railway Hospital. All rights reserved.</p>
    </footer>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="doctors_profile_script.js"></script>

    <style>
        .doctors-profile-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #f2f2f2;
            border-radius: 8px;
            color: #006400;
        }
        .toolbar {
            margin-bottom: 1rem;
        }
        .toolbar button, .button-label {
            background-color: #006400;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        #import-excel {
            display: none;
        }
        .doctor-selection, .doctor-details-form {
            margin-top: 1rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover, .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        #doctor-form input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</body>
</html>
